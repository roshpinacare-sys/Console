#
#

name: line-agreement

on:
  workflow_dispatch:
  schedule:
    - cron: '19 */2 * * *'
permissions:
  contents: write

concurrency:
  group: line-agreement
  cancel-in-progress: false

jobs:
  agreement:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Node 20
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Ledger-vs-chain agreement gate
        run: node agents/line-agreement.mjs

      - name: Publish the agreement book (a red verdict is committed first, then the run fails)
        if: always()
        run: |
          git config user.name "roshpinacare-sys"
          git config user.email "326012154+roshpinacare-sys@users.noreply.github.com"
          git add weave/agreement.json
          if ! git diff --cached --quiet; then
            VERDICT="$(node -e 'try{const d=require("./weave/agreement.json");process.stdout.write(d.verdict||"none")}catch{process.stdout.write("none")}')"
            MIS="$(node -e 'try{const d=require("./weave/agreement.json");process.stdout.write(String(d.mismatches))}catch{process.stdout.write("?")}')"
            git commit -m "line-agreement: ${VERDICT} · ${MIS} mismatches · $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            # T-78 (measured: 30/46 runs red — plain `git pull --rebase` deadlocks on a
            # CONFLICT (rebase stays mid-flight, every retry re-fails) with the
            # dex-beat/pacemaker writers of this repo). Conflict-safe publish: fresh
            # verdict wins (-X theirs), abort/reset between attempts, lost push = honest
            # skip (the next 2h beat re-measures; the verdict lives in the run log).
            OK=0
            for i in 1 2 3; do
              if git pull --rebase -X theirs --autostash -q origin main && git push -q origin main; then OK=1; break; fi
              git rebase --abort 2>/dev/null || true
              git rebase --quit 2>/dev/null || true
              sleep $((i * 6))
            done
            [ "$OK" = "1" ] && echo "agreement book pushed" || echo "push lost the race — verdict in run log, next beat re-measures (honest skip)"
          else
            echo "no agreement change to publish"
          fi
