#
#

name: chain-vitals

on:
  workflow_dispatch:
  schedule:
    - cron: '56 */2 * * *'
permissions:
  contents: write

concurrency:
  group: chain-vitals
  cancel-in-progress: false

jobs:
  vitals:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Node 20
        uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: All-lines pulse (keyless parallel measurement)
        run: node agents/chain-vitals.mjs

      - name: Publish the vitals book
        if: always()
        run: |
          git config user.name "roshpinacare-sys"
          git config user.email "326012154+roshpinacare-sys@users.noreply.github.com"
          git add weave/vitals.json
          if ! git diff --cached --quiet; then
            VERDICT="$(node -e 'try{const d=require("./weave/vitals.json");process.stdout.write(d.verdict||"none")}catch{process.stdout.write("none")}')"
            UP="$(node -e 'try{const d=require("./weave/vitals.json");process.stdout.write(d.summary.up+"/"+d.summary.lines)}catch{process.stdout.write("?")}')"
            git commit -m "chain-vitals: ${VERDICT} · ${UP} lines up · $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            for i in 1 2 3; do
              if git pull --rebase -X theirs --autostash origin main && git push; then break; fi
              echo "push race, retry ${i}"; sleep 8
            done
          else
            echo "no vitals change to publish"
          fi
