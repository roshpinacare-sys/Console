#
#   EDGE-POSITIVE-GRID-MAY-RUN  — edge ≥ +1%
#

name: pnl-desk

on:
  workflow_dispatch:
  schedule:
    - cron: '36 5 * * *'
permissions:
  contents: write

concurrency:
  group: pnl-desk
  cancel-in-progress: false

jobs:
  desk:
    runs-on: ubuntu-latest
    env:
      FLEET_ROSTER_MAP: ${{ secrets.FLEET_ROSTER_MAP }} # refs layer (19-d): ref→name resolution for books + write-time scrub
    timeout-minutes: 9
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Weekly edge book (keyless, chain truth)
        run: node agents/pnl-desk.mjs

      - name: Publish the edge verdict
        if: always()
        run: |
          node agents/redact-telemetry.mjs dex/pnl-desk.json
          git add dex/pnl-desk.json
          if ! git diff --cached --quiet; then
            VERDICT="$(node -e 'try{const d=require("./dex/pnl-desk.json");process.stdout.write(d.verdict||"none")}catch{process.stdout.write("none")}')"
            EDGE="$(node -e 'try{const d=require("./dex/pnl-desk.json");process.stdout.write(String(d.trailing7d&&d.trailing7d.edgePct))}catch{process.stdout.write("?")}')"
            git config user.name "roshpinacare-sys"
            git config user.email "326012154+roshpinacare-sys@users.noreply.github.com"
            git commit -m "pnl-desk: ${VERDICT} · trailing-7d edge ${EDGE}% · $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push
          else
            echo "no pnl-desk change to publish"
          fi
