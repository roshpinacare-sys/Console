#
#   fee_bps = clamp(base + K_VOL × σ, base, min(2 × base, 200))
#

name: fee-law

on:
  workflow_dispatch:
  schedule:
    - cron: '43 6 * * *'
permissions:
  contents: write

concurrency:
  group: fee-law
  cancel-in-progress: false

jobs:
  fee-law:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout the public console
        uses: actions/checkout@v4

      - name: Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Measure the fee law (keyless, local book only)
        run: node dex/fee-law.mjs

      - name: Publish the fee-law book
        run: |
          git config user.name "fee-law[bot]"
          git config user.email "fee-law[bot]@users.noreply.github.com"
          node agents/redact-telemetry.mjs dex/fee-law.json
          git add dex/fee-law.json
          if git diff --cached --quiet; then
            echo "the fee-law book is unchanged"
            exit 0
          fi
          SIG_NOW="$(jq -Sc '{v: .verdict, p: [.pools[] | {key, feeBps, sigmaBps}]}' dex/fee-law.json)"
          git show HEAD:dex/fee-law.json > /tmp/prev-fee-law.json 2>/dev/null \
            && SIG_PREV="$(jq -Sc '{v: .verdict, p: [.pools[] | {key, feeBps, sigmaBps}]}' /tmp/prev-fee-law.json)" \
            || SIG_PREV=""
          LAST_TS="$(git log -1 --format=%cI -- dex/fee-law.json)"
          LAST_S="$(date -u -d "$LAST_TS" +%s 2>/dev/null || echo 0)"
          AGE_H=$(( ($(date -u +%s) - LAST_S) / 3600 ))
          if [ "$SIG_NOW" = "$SIG_PREV" ] && [ "$AGE_H" -lt 20 ]; then
            echo "fee-law state unchanged and heartbeat fresh (${AGE_H}h < 20h) - no commit, Pages quota spared"
            exit 0
          fi
          git commit -m "fee-law: $(date -u +%FT%TZ) · verdict: $(jq -r '.verdict' dex/fee-law.json) · $(jq -r '[.pools[] | select(.deltaBps > 0) | .key + " " + (.baseBps|tostring) + "->" + (.feeBps|tostring) + "bps"] | join(", ") | if . == "" then "all pools at base" else . end' dex/fee-law.json)"
          for i in 1 2 3; do git pull --rebase --autostash origin main && git push && break || sleep 3; done
