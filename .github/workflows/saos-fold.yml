# saos-fold — the live SAOS protocol heartbeat (saos.live.v1).
# Reads every custom_json op the relayer published on the public chain,
# re-verifies every inner signature with saos-live.js (the same code every
# browser runs), folds them deterministically, countersigns pending deposit
# claims with the genesis treasury key (rates the treasury itself published
# on chain), and republishes saos-live.json. Fail-closed: any error leaves
# the previous book untouched and exits red.
name: saos-fold

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: saos-fold
  cancel-in-progress: false

jobs:
  fold:
    runs-on: ubuntu-latest
    env:
      SAOS_TREASURY_WIF: ${{ secrets.SAOS_TREASURY_WIF }}
      SAOS_RELAY_WIF: ${{ secrets.SAOS_RELAY_WIF }}
      SAOS_RELAY_ACCOUNT_B64: aGVhZGNvcm5lcg==
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Fold the chain into the live book
        run: node agents/saos-fold.mjs
      - name: Publish the book (only on GREEN)
        run: |
          git config user.name "roshpinacare-sys"
          git config user.email "326012154+roshpinacare-sys@users.noreply.github.com"
          git add saos-live.json
          if ! git diff --cached --quiet; then
            git commit -m "saos-fold: live book republished · stateRoot ${STATE_ROOT:0:12} · $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            # [wave 19.54 · trace 1a15e3e419138aa5] house pull-rebase-retry law at the
            # writer (precedents 19.52-e agent9-fleet-truth adb3ca7, 19.52-c arming-flip
            # 703534ca): the fold commits the republished book then a bare push lost to a
            # sibling beat (giants-beat 10:04:29Z) — run at 10:06:34Z red "[rejected]
            # main -> main (fetch first)" AFTER a correct green fold. Retry with growing
            # backoff; the fold itself already succeeded, so a lost race only re-publishes
            # at the next 15-min slot (fail-soft, honest give-up after 5).
            for attempt in 1 2 3 4 5; do
              if git push; then echo "book published (attempt ${attempt})"; exit 0; fi
              echo "push failed (attempt ${attempt}); pulling siblings and retrying"
              # saos-live.json has one writer (this fold), so the rebase replays our
              # fresh book over the sibling's foreign files; if the replay comes out
              # empty (book already identical upstream) the push is an honest no-op.
              git pull --rebase -X theirs --autostash origin main || { git rebase --abort 2>/dev/null || true; git reset --hard origin/main; }
              git add saos-live.json 2>/dev/null || true
              git diff --cached --quiet || git commit -m "saos-fold: live book republished · stateRoot ${STATE_ROOT:0:12} · $(date -u +%Y-%m-%dT%H:%M:%SZ)"
              sleep $((attempt * 5))
            done
            echo "named terminal: publish-deferred — the fold was GREEN, the book re-publishes at the next 15-min slot (anti-storm: record, not alarm)"
            exit 0
          else
            echo "book unchanged — nothing to publish"
          fi
        env:
          STATE_ROOT: unknown
