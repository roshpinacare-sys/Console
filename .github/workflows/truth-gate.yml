# TRUTH-GATE - the system proves itself (BENCHMARK.md stage 3)
#
# Runs inside the PUBLIC Console repository, its own GITHUB_TOKEN, zero
# LIVE deployed site - not the repo - and commits the verdict:
#   truth/latest.json  - the full report of the run
#   truth/history.json - one line per run (public, capped history)
# A red verdict commits FIRST (the truth is always recorded), then fails
# the workflow run itself - a red X in the public Actions history.
#
# commits the beacon at :45; Pages deploys it; this gate grades what the world
# actually sees. The commit itself is semantically gated - latest.json carries
# run timestamps, so a raw diff would commit (and rebuild Pages) on every run.
# Commit only when the verdict, counts, or per-gate statuses truly change, or
# when the last committed heartbeat is older than 6h (liveness proof, sparse).
#
# G63 (2026-10-22, measured): the hourly cron '11 * * * *' is DILUTED by the
# platform scheduler — measured gaps 2.5h-4h (04:49→07:17→08:28), and the
# owner-facing truth page froze for hours while the fleet ran fine around it.
# Fix — never a single cadence source (the giants law):
#   1. the hourly cron stays (best effort),
#   2. workflow_run ANCHOR: every successful deploy/identity/pnl run re-ignites
#      the gate (event-driven, not scheduler-dependent),
#   3. a 45min dedup step keeps the anchor honest (no hammering),
#   4. the runtime-pacemaker stays the last-resort backstop (SLA 90min).
#
# G64 (2026-10-22 13:05Z, measured — the anchor was alive and measuring NOTHING):
#   the G63 dedup asked the runs-list "is there a fresh run?" — but every skip
#   run IS a run, and anchors fire after every pages build (fleet commits every
#   few minutes), so runs[0] was always the run itself (age 0min < 45min):
#   every anchored run dedup-skipped itself forever. Measured: all runs since
#   11:41Z are 14-95s empty skips, published latest.json frozen at 10:45:55Z
#   (2h17m) while 15 green runs accumulated. The pacemaker was blinded the
#   same way — it saw fresh (empty) runs and never ignited.
#   Lesson: a run existing is not a measurement happening. The only honest
#   clock is the PUBLISHED ARTIFACT itself — the very thing the owner reads.
#   Fix: dedup now curls the published truth/latest.json and measures ITS age
#   (fail-open: unreadable page => we measure). A skip-run can no longer
#   masquerade as a verdict. Beacon 3h -> 50min so the page visibly refreshes
#   every anchor cycle (~45-55min, the promised rhythm) even when all-green.

name: truth-gate

on:
  schedule:
    - cron: '11 * * * *'
  workflow_dispatch:
  workflow_run:
    workflows: ["pages build and deployment", "identity-guard", "pnl-desk"]
    types: [completed]

permissions:
  contents: write

concurrency:
  group: truth-gate
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout the public console
        uses: actions/checkout@v5

      - name: Node 20
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      # G64 anchor dedup: an anchored run is only useful if the PUBLISHED verdict
      # is actually stale. G63 asked the runs-list — but skip-runs are runs too,
      # so the list was always "fresh" and the gate measured nothing for 2h17m
      # (measured). Now we ask the artifact itself, the exact bytes the owner
      # reads at roshpinacare-sys.github.io/Console/truth/latest.json.
      # Fail-open: if the page does not answer or does not parse, we measure —
      # an extra measurement is never a lie, a skipped refresh could be.
      - name: Anchor dedup — skip if the published verdict itself is fresh (<45min)
        if: github.event_name == 'workflow_run'
        run: |
          set +e
          RESP="$(curl -s --max-time 20 "https://roshpinacare-sys.github.io/Console/truth/latest.json")"
          LAST="$(node -e '
            let d={}; try{d=JSON.parse(process.argv[1])}catch(e){}
            console.log(d.at||"");
          ' "$RESP")"
          if [ -z "$LAST" ]; then echo "published verdict unreadable (or CDN silent) — fail-open: measure"; exit 0; fi
          LAST_S="$(date -u -d "$LAST" +%s 2>/dev/null || echo 0)"
          AGE_MIN=$(( ($(date -u +%s) - LAST_S) / 60 ))
          if [ "$AGE_MIN" -lt 45 ]; then
            echo "published verdict is fresh (${AGE_MIN}min old < 45min) — anchor dedup exits, hammering prevented"
            exit 0
          fi
          echo "published verdict is stale (${AGE_MIN}min >= 45min) — anchored measurement proceeds"

      - name: Run the truth gate against the live site
        id: gate
        continue-on-error: true
        run: node truth/truth-gate-ci.cjs

      - name: Commit the verdict (always - red or green)
        if: always()
        run: |
          set +e
          git config user.name "roshpinacare-sys"
          git config user.email "326012154+roshpinacare-sys@users.noreply.github.com"
          SIG_NOW="$(node -e 'const d=require("./truth/latest.json");console.log([d.verdict,d.counts.pass,d.counts.fail,d.counts.skip,...d.results.map(r=>r.gate+":"+r.status)].join("|"))' 2>/dev/null || echo x)"
          git show HEAD:truth/latest.json > /tmp/prev-truth.json 2>/dev/null \
            && SIG_PREV="$(node -e 'const d=require("/tmp/prev-truth.json");console.log([d.verdict,d.counts.pass,d.counts.fail,d.counts.skip,...d.results.map(r=>r.gate+":"+r.status)].join("|"))' 2>/dev/null || echo y)" \
            || SIG_PREV=""
          # verdict), NOT from git log — shallow clones make `git log -1 -- <path>`
          # resolve the grafted tip, so the >6h freshness beacon could never fire.
          LAST_TS="$(node -e 'try{console.log(require("/tmp/prev-truth.json").at||"")}catch(e){console.log("")}' 2>/dev/null)"
          LAST_S="$(date -u -d "$LAST_TS" +%s 2>/dev/null || echo 0)"
          AGE_MIN=$(( ($(date -u +%s) - LAST_S) / 60 ))
          # גל-57: beacon 6→3ש'. גל-64: 3ש'→50דק' — נמדד-חי: עם-עוגן-חי (G63) מדידה-ירוקה
          # כל-~45-55דק' לא נקומטה (SIG זהה, גיל <3ש') ודף-האמת קפא 2h17m מול-15 ריצות-ירוקות.
          # הבעלים קורא את ה-`at` — הדף-חייב לנשום בקצב-המדידה. מעתה: כל-מדידה-עם-גיל-≥50דק'
          # נקומטת — טריות ≤~55דק' · בניית-Pages-אחת-ל-~50דק' (זול) · אפס-WARN.
          if [ "$SIG_NOW" = "$SIG_PREV" ] && [ "$AGE_MIN" -lt 50 ]; then
            echo "verdict semantically unchanged and published heartbeat fresh (${AGE_MIN}min < 50min) - no commit, Pages quota spared"
            exit 0
          fi
          for attempt in 1 2 3; do
            git add truth/latest.json truth/history.json truth/slo.json
            if git diff --cached --quiet; then
              echo "no verdict change to commit (attempt ${attempt})"
              exit 0
            fi
            VERDICT=$(node -e "console.log(require('./truth/latest.json').verdict)" 2>/dev/null || echo UNKNOWN)
            git commit -m "truth-gate: $(date -u +%FT%TZ) · ${VERDICT}"
            git pull --rebase -X theirs --autostash origin main
            if git push; then
              echo "verdict committed on attempt ${attempt}: ${VERDICT}"
              exit 0
            fi
            echo "push failed (attempt ${attempt}); resetting to origin and re-running the gate"
            git checkout -- .
            git reset --hard origin/main
            node truth/truth-gate-ci.cjs
          done
          echo "ERROR: could not commit the verdict after 3 attempts"
          exit 1

      - name: A red gate fails the run in public
        if: steps.gate.outcome == 'failure'
        run: |
          echo "truth-gate is RED - the verdict is committed above; this run fails with it"
          exit 1
