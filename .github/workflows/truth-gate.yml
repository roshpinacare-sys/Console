# TRUTH-GATE - the system proves itself (BENCHMARK.md stage 3)
#
# Runs inside the PUBLIC Console repository, its own GITHUB_TOKEN, zero
# secrets. Every hour the machine (truth/truth-gate-ci.cjs) measures the
# LIVE deployed site - not the repo - and commits the verdict:
#   truth/latest.json  - the full report of the run
#   truth/history.json - one line per run (public, capped history)
# A red verdict commits FIRST (the truth is always recorded), then fails
# the workflow run itself - a red X in the public Actions history.
#
# Cadence (R67-A minute/Pages-quota diet): every 3h at :07. console-publish
# commits the beacon at :45; Pages deploys it; this gate grades what the world
# actually sees. The commit itself is semantically gated - latest.json carries
# run timestamps, so a raw diff would commit (and rebuild Pages) on every run.
# Commit only when the verdict, counts, or per-gate statuses truly change, or
# when the last committed heartbeat is older than 6h (liveness proof, sparse).

name: truth-gate

on:
  schedule:
    - cron: '7 */3 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: truth-gate
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout the public console
        uses: actions/checkout@v4

      - name: Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run the truth gate against the live site
        id: gate
        continue-on-error: true
        run: node truth/truth-gate-ci.cjs

      - name: Commit the verdict (always - red or green)
        if: always()
        run: |
          set +e
          git config user.name "truth-gate[bot]"
          git config user.email "truth-gate[bot]@users.noreply.github.com"
          # R67-A semantic gate: verdict+counts+gate statuses (never the timestamps)
          SIG_NOW="$(node -e 'const d=require("./truth/latest.json");console.log([d.verdict,d.counts.pass,d.counts.fail,d.counts.skip,...d.results.map(r=>r.gate+":"+r.status)].join("|"))' 2>/dev/null || echo x)"
          git show HEAD:truth/latest.json > /tmp/prev-truth.json 2>/dev/null \
            && SIG_PREV="$(node -e 'const d=require("/tmp/prev-truth.json");console.log([d.verdict,d.counts.pass,d.counts.fail,d.counts.skip,...d.results.map(r=>r.gate+":"+r.status)].join("|"))' 2>/dev/null || echo y)" \
            || SIG_PREV=""
          LAST_TS="$(git log -1 --format=%cI -- truth/latest.json)"
          LAST_S="$(date -u -d "$LAST_TS" +%s 2>/dev/null || echo 0)"
          AGE_H=$(( ($(date -u +%s) - LAST_S) / 3600 ))
          if [ "$SIG_NOW" = "$SIG_PREV" ] && [ "$AGE_H" -lt 6 ]; then
            echo "verdict semantically unchanged and heartbeat fresh (${AGE_H}h < 6h) - no commit, Pages quota spared"
            exit 0
          fi
          for attempt in 1 2 3; do
            git add truth/latest.json truth/history.json truth/slo.json
            if git diff --cached --quiet; then
              echo "no verdict change to commit (attempt ${attempt})"
              exit 0
            fi
            VERDICT=$(node -e "console.log(require('./truth/latest.json').verdict)" 2>/dev/null || echo UNKNOWN)
            git commit -m "truth-gate: $(date -u +%FT%TZ) · ${VERDICT}"
            git pull --rebase origin main
            if git push; then
              echo "verdict committed on attempt ${attempt}: ${VERDICT}"
              exit 0
            fi
            echo "push failed (attempt ${attempt}); resetting to origin and re-running the gate"
            git checkout -- .
            git reset --hard origin/main
            node truth/truth-gate-ci.cjs
          done
          echo "ERROR: could not commit the verdict after 3 attempts"
          exit 1

      - name: A red gate fails the run in public
        if: steps.gate.outcome == 'failure'
        run: |
          echo "truth-gate is RED - the verdict is committed above; this run fails with it"
          exit 1
