# KEY-VERIFY — בדיקת המפתח שהמפעיל הוסיף בגיטהאב (R38).
#
# המפעיל הזין סוד HEADCORNER בכספת הריפו הציבורי. רק ריצות Actions של
# הריפו הזה יכולות לקרוא אותו — ולכן הבדיקה חיה כאן. הסוכן גוזר את
# המפתח-הציבורי, משווה מול הרשות החיה של @headcorner בשרשרת, ומפרסם
# קבלה כנה (receipts/key-check.json). בהתאמה מלאה בלבד — הוא מאטם את
# ה-WIF אל כספת ריפו-המנוע (saos-dex/STEEM_ACTIVE_WIF) ומזניק את הגריד.
#
# אפשר להפעיל ידנית בכל רגע (workflow_dispatch). הערך עצמו לעולם לא
# מופיע בלוג, בדיסק או בקבלה.

name: key-verify

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: key-verify
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Sodium (sealing into the engine vault)
        run: npm install --prefix /tmp/sodium libsodium-wrappers@0.7.15

      - name: Verify the operator key against the live chain
        env:
          HEADCORNER: ${{ secrets.HEADCORNER }}
          AGENTS_WATCH_TOKEN: ${{ secrets.AGENTS_WATCH_TOKEN }}
          SODIUM_DIR: /tmp/sodium
        run: node agents/key-verify.mjs

      - name: Publish the receipt (verdict, never the value)
        if: always()
        run: |
          git add receipts/key-check.json receipts/key-check-log.jsonl
          if ! git diff --cached --quiet; then
            VERDICT="$(node -e 'try{process.stdout.write(require("./receipts/key-check.json").verdict)}catch{process.stdout.write("none")}')"
            git config user.name "key-verify"
            git config user.email "key-verify@users.noreply.github.com"
            git commit -m "key-verify: ${VERDICT} · $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push
          else
            echo "no receipt change to publish"
          fi
