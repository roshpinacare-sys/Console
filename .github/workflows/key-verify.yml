#
#

name: key-verify

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: key-verify
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      FLEET_ROSTER_MAP: ${{ secrets.FLEET_ROSTER_MAP }} # refs layer (19-d): ref→name resolution for books + write-time scrub
    timeout-minutes: 9
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Sodium (sealing into the engine vault)
        run: npm install --prefix /tmp/sodium libsodium-wrappers@0.7.15

      - name: Verify the operator key against the live chain
        env:
          MANAGER_KEY: ${{ secrets.MANAGER_KEY }} # שם-ניטרלי-בכוונה; הסוד-מוגדר-אצל-המפעיל
          AGENTS_WATCH_TOKEN: ${{ secrets.AGENTS_WATCH_TOKEN }}
          SODIUM_DIR: /tmp/sodium
        run: node agents/key-verify.mjs

      - name: Publish the receipt (verdict, never the value)
        if: always()
        run: |
          # self-audit 2026-10-13: the engine migrated to the lawful path
          # (receipts/key-verify* per 25-d; key-check* is a forbidden-path
          # class) — this step still added the forbidden names, so `git add`
          # hit a pathspec error and every dispatch landed red. Aligned.
          # Measured on run 38486151903: the lawful path + receipt landed,
          # then the bare push raced the fleet (remote rejected, ref moved) —
          # wrapped in the fleet T-78 law (race-safe publish, never force).
          node agents/redact-telemetry.mjs receipts/key-verify.json receipts/key-verify-log.jsonl
          git add receipts/key-verify.json receipts/key-verify-log.jsonl
          if ! git diff --cached --quiet; then
            VERDICT="$(node -e 'try{process.stdout.write(require("./receipts/key-verify.json").verdict)}catch{process.stdout.write("none")}')"
            git config user.name "roshpinacare-sys"
            git config user.email "326012154+roshpinacare-sys@users.noreply.github.com"
            git commit -m "key-verify: ${VERDICT} · $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            OK=0
            for i in 1 2 3; do
              if git pull --rebase -X theirs --autostash -q origin main && git push -q origin main; then OK=1; break; fi
              sleep $((i * 4))
            done
            if [ "$OK" = "1" ]; then echo "receipt published (${VERDICT})"; else
              echo "named terminal: key-verify-receipt-deferred — verdict ${VERDICT} is recorded in this run's log; next dispatch re-lands it (record, not alarm)"
            fi
          else
            echo "no receipt change to publish"
          fi
