# GIANTS-BEAT (R74) · טבלת-העושר החיה של הענקים
#
# הרצה ציבורית (דקות-Actions בלתי-מוגבלות): מודד את עמלות-הפרוטוקול והנפחים של
# ענקי-ה-DeFi מ-API ציבוריים של DefiLlama (GET בלבד, אפס-מפתחות) ומצרף את שורת
# הרשת שלנו מהספר החי dex/world.json. הספר הוא המקור של "שולחן-הענקים"
# (giants.html) ושל סולם-העקיפה: אנחנו לא מספרים סיפורים על הענקים · אנחנו מודדים אותם.
#
# אפס-סודות, אפס-מפתחות, אפס-סנדבוקס · fail-closed: גם כישלון-מקור מתפרסם כעדות.
# R28 Pages-quota: commit רק כשהנתונים באמת זזו (או פעימת-לב ישנה מ-20h).

name: giants-beat

on:
  workflow_dispatch:
  schedule:
    - cron: '41 5 * * *'
permissions:
  contents: write

concurrency:
  group: giants-beat
  cancel-in-progress: false

jobs:
  giants:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout the public console
        uses: actions/checkout@v4

      - name: Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Measure the giants (keyless)
        run: node dex/giants.mjs

      - name: Publish the giants book
        run: |
          git config user.name "giants-beat[bot]"
          git config user.email "giants-beat[bot]@users.noreply.github.com"
          git add dex/giants.json
          if git diff --cached --quiet; then
            echo "the giants book is unchanged"
            exit 0
          fi
          # R28 gate: commit רק כשהמספרים באמת זזו (עמלות/נפחים/שורת-הרשת)
          # או כשפעימת-הלב ישנה מ-20h. publishedAt זז כל ריצה · הוא לא סיבה ל-commit.
          SEM_NOW="$(jq -Sc '{f: [.families[] | {id, fees24h, fees30d, feesAllTime, vol24h, vol30d}], o: .ours, e: .errors}' dex/giants.json)"
          git show HEAD:dex/giants.json > /tmp/prev-giants.json 2>/dev/null \
            && SEM_PREV="$(jq -Sc '{f: [.families[] | {id, fees24h, fees30d, feesAllTime, vol24h, vol30d}], o: .ours, e: .errors}' /tmp/prev-giants.json)" \
            || SEM_PREV=""
          LAST_TS="$(git log -1 --format=%cI -- dex/giants.json)"
          LAST_S="$(date -u -d "$LAST_TS" +%s 2>/dev/null || echo 0)"
          AGE_H=$(( ($(date -u +%s) - LAST_S) / 3600 ))
          if [ "$SEM_NOW" = "$SEM_PREV" ] && [ "$AGE_H" -lt 20 ]; then
            echo "giants state unchanged and heartbeat fresh (${AGE_H}h < 20h) - no commit, Pages quota spared"
            exit 0
          fi
          git commit -m "giants-beat: $(date -u +%FT%TZ) · $(jq -r '.families | length' dex/giants.json) families · top30d: $(jq -r '.families[0].name + " $" + (.families[0].fees30d | tostring)' dex/giants.json) · $(jq -r 'if .errors | length == 0 then "clean" else "ERRORS: " + (.errors | join(" | ")) end' dex/giants.json)"
          for i in 1 2 3; do git pull --rebase --autostash origin main && git push && break || sleep 3; done
