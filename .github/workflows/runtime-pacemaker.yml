# runtime-pacemaker — קצב-הלב שלא נשען על ה-scheduler של הפלטפורמה.
# ═════════════════════════════════════════════════════════════════════════════
# מדידה (מפקד 2026-10-12): ה-scheduler של GitHub יורה נאמן על הריפו הוותיקים
# (Console 2,500 הרצות schedule · saos-runtime · FleetHQ) ומשתיק 100% מה-crons
# על ריפו-הריצה החדשים (Autonomy · Pulse · GridWatch: אפס הרצות schedule מעולם,
# עם crons מוגדרים ו-workflows active). התוצאה: מוח-הריצה פועם רק כשסשן-סוכן
# ער — בדיוק ה"רשת מכבה את עצמה" שאובחנה.
#
# התשובה ההנדסית (בלי אמון בפלטפורמה, בלי סנדבוקס, בלי סוכן ער):
#   SENSE  — גיל הרצה-אחרונה של כל עורק קריטי, דרך ה-API.
#   DECIDE — גיל > SLA (2x הקצב הנומינלי) וההרצה האחרונה לא בעיצומה => העורק מאחר.
#   ACT    — workflow_dispatch דרך CROSS_REVIVE_PAT (הרשות-המואצלת של הרשת,
#            כבר בשימוש opens-closer). מוגבל ל-8 הצתות למחזור — בלי self-DoS.
#   RECORD — קבלה כנה אחת למחזור ב-pacemaker/state/beats.jsonl (קומיט בגיט =
#            הוכחה גלויה). אם הקבלה מפסיקה להתעדכן — הפצמר עצמו מת; גם זה נאזעק.
#
# חוקי-כנות: לעולם לא לזייף הצתה; עורק שנכשל נשאר אדום על הלוח שלו — הפצמר
# מצית, לא משתיק; DRYRUN=1 מודד ומדווח בלי להצית.
# ═════════════════════════════════════════════════════════════════════════════
name: runtime-pacemaker

on:
  schedule:
    # שלוש שורות staggered — האיחוד יורה כל ~5 דקות
    - cron: "6,26,46 * * * *"
    - cron: "11,31,51 * * * *"
    - cron: "17,37,57 * * * *"
  workflow_dispatch: {}
  repository_dispatch:
    types: [pacemaker-tick]
  # עוגן-אירוע (חוק-הענקים: לעולם לא מקור-קצב יחיד) — טריגר-workflow_run לא תלוי
  # רישום-scheduler; כל סיום של lanes ותיקים-מוכחים-שהם-יורים מזניק מחזור-פצמר.
  # G64 (2026-10-22 13:40Z, מדוד): העוגן-המקורי נבנה על lanes שהם עצמם crons —
  # וה-scheduler שתק את כולם יחד (אף ריצת Console חוץ מ-truth-gate/identity-guard/
  # pages-deploy מ-12:54; הפצמר עצמו שקט 40+ דק' מול קצב-5 דק'). עוגן-על-עוגן-שותק
  # = שתיקה. לכן הוספו pages-deploy / identity-guard / truth-gate — העורקים-המוכחים
  # שאינם-scheduler: יורים על כל דחיפת-צי (PAT — אירוע חי), כל דקות-ספורות.
  # והדה-כפל (שיעור-גל-64 מ-truth-gate): מול הארטיפקט-עצמו — גיל beats.jsonl —
  # כי ריצות-דילוג הן ריצות והרשימה משקרת; הארטיפקט הוא השעון הכן היחיד.
  workflow_run:
    workflows: [trigger-mesh, dex-watch, chain-vitals, estate-scrub, money-watch, grid-pulse, pages-deploy, identity-guard, truth-gate]
    types: [completed]

permissions:
  contents: write

concurrency:
  group: runtime-pacemaker
  cancel-in-progress: false

jobs:
  beat:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      # G64 anchor dedup — שתי-שכבות:
      # (א) ראשית — מול הארטיפקט (שיעור-גל-64): גיל beats.jsonl ב-HEAD < 25 דק' => יציאה כנה.
      # (ב) נגד-דריכה — ריצת-פצמר אחרת (לא-אני) הושלמה < 5 דק' => יציאה. ה-עצמי-מוחרג
      #     לפי-run-id (מדוד: הרשימה כוללת את-הריצה-עצמה בגיל-0); הכיוון כאן הפוך
      #     משיעור-truth-gate — כאן הרשימה מגינה מסערת-עוגנים מקבילים (מדוד 13:39-13:42:
      #     8 ריצות-עוגן חופפות — קבוצת-ה-concurrency לא אכפה מול-workflow_run).
      # Fail-open בשתי-השכבות: שתיקת-API => דופקים (פעימה-נוספת היא מדידה כנה).
      - name: Anchor dedup — receipt-fresh + no-recent-sibling (anti-hammer)
        if: github.event_name == 'workflow_run'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          LAST="$(node -e '
            const fs=require("fs");
            try{
              const lines=fs.readFileSync("pacemaker/state/beats.jsonl","utf8").trim().split("\n");
              const b=JSON.parse(lines[lines.length-1]);
              console.log(b.at||"");
            }catch(e){console.log("")}
          ')"
          if [ -n "$LAST" ]; then
            LAST_S="$(date -u -d "$LAST" +%s 2>/dev/null || echo 0)"
            AGE_MIN=$(( ($(date -u +%s) - LAST_S) / 60 ))
            if [ "$AGE_MIN" -lt 25 ]; then
              echo "receipt is fresh (${AGE_MIN}min < 25min) — anchor dedup exits, no hammering"
              exit 0
            fi
            echo "receipt is stale (${AGE_MIN}min >= 25min) — proceeding to sibling check"
          else
            echo "receipt unreadable — fail-open: beat"
          fi
          RESP="$(curl -s --max-time 15 -H "Authorization: Bearer ${GH_TOKEN}" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/runtime-pacemaker.yml/runs?per_page=6")"
          SIBLING="$(node -e '
            let d={}; try{d=JSON.parse(process.argv[1])}catch(e){}
            const me=String(process.argv[2]);
            const runs=(d.workflow_runs||[]).filter(r=>r.name==="runtime-pacemaker"&&String(r.id)!==me);
            console.log(runs.length?runs[0].created_at:"");
          ' "$RESP" "${GITHUB_RUN_ID}")"
          if [ -n "$SIBLING" ]; then
            S_S="$(date -u -d "$SIBLING" +%s 2>/dev/null || echo 0)"
            S_MIN=$(( ($(date -u +%s) - S_S) / 60 ))
            if [ "$S_MIN" -lt 6 ]; then
              echo "sibling beat created ${S_MIN}min ago (< 6min, any status) — anti-hammer exits"
              exit 0
            fi
          fi
          echo "no recent sibling — anchored beat proceeds"

      - name: SENSE late arteries -> IGNITE (cross-repo dispatch token) -> RECORD receipt
        env:
          # Console-hosted instance: the estate's existing dispatch credential
          # (AGENTS_WATCH_TOKEN already dispatches cross-repo, e.g. money-watch -> saos-dex).
          # Same env name as the FleetHQ instance so agents/pacemaker.mjs stays identical.
          CROSS_REVIVE_PAT: ${{ secrets.AGENTS_WATCH_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: node agents/pacemaker.mjs

      # קומיט-ממושפע: קבלה בלבד (אף-פעם לא -A) · rebase ×3 · כשל = יציאה 1
      - name: commit receipt (honest, rebase x3)
        if: always()
        run: |
          git config user.name "runtime-pacemaker"
          # DECISIONS #10: NAME@users.noreply.github.com maps to a real foreign GitHub
          # account — estate writers commit in the @agents.roshpinacare-sys namespace.
          git config user.email "runtime-pacemaker@agents.roshpinacare-sys"
          git add pacemaker/state/beats.jsonl
          if git diff --cached --quiet; then
            echo "receipt unchanged — nothing to commit"
            exit 0
          fi
          git commit -m "pacemaker receipt: $(date -u +%FT%TZ)"
          OK=0
          for i in 1 2 3; do
            if git pull --rebase -X theirs --autostash origin main && git push origin main; then OK=1; echo "push ok (attempt $i)"; break; fi
            git rebase --abort 2>/dev/null || true
            sleep 5
          done
          [ "$OK" = "1" ] || { echo "receipt push failed after 3 attempts — honest failure"; exit 1; }
