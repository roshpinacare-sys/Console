
name: workflow-yaml-guard

on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read

concurrency:
  group: workflow-yaml-guard
  cancel-in-progress: false

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: sovereign-clone (git native — אפס-תלות)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git clone --depth 1 "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" repo

      - name: yaml-parse-every-workflow (שער-על-שמו)
        run: |
          set -euo pipefail
          cd repo
          python3 .github/scripts/yaml_guard.py
