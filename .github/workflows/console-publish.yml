#
#

name: console-publish

on:
  schedule:
    - cron: '38 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: console-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      FLEET_ROSTER_MAP: ${{ secrets.FLEET_ROSTER_MAP }} # refs layer (19-d): ref→name resolution for books + write-time scrub
    timeout-minutes: 10
    steps:
      - name: Checkout the public console
        uses: actions/checkout@v4

      - name: Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Render status from the public chain (keyless)
        env:
          # exposure law: the renderer speaks refs; the name↔ref map is runtime-only.
          # The signer set itself is derived from the previous book at HEAD (render.mjs).
          FLEET_ROSTER_MAP: ${{ secrets.FLEET_ROSTER_MAP }}
        run: bun render.mjs

      - name: Commit the beacon
        run: |
          git config user.name "roshpinacare-sys"
          git config user.email "326012154+roshpinacare-sys@users.noreply.github.com"
          git add status.json
          if git diff --cached --quiet; then
            echo "no status change; the witness line is unchanged on-chain"
          else
            CP=$(jq -r '.witness.checkpoint' status.json)
            AGE=$(jq -r '.freshness.ageHours' status.json)
            git commit -m "weave-console: $(date -u +%FT%TZ) · cp#${CP} · witness age ${AGE}h · keyless read from public chain"
            # T-78 (measured: run 38482453382 rejected fetch-first — dex-beat/estate-scrub
            # commit to this repo every minute): race-safe publish. The fresh render wins
            # (-X theirs during rebase = our local replay); a lost push after retries is
            # an honest skip — the next hourly beat re-renders from the chain anyway.
            OK=0
            for i in 1 2 3 4; do
              if git pull --rebase -X theirs --autostash -q origin main && git push -q origin main; then OK=1; break; fi
              git rebase --abort 2>/dev/null || true
              git rebase --quit 2>/dev/null || true
              git checkout -- . 2>/dev/null || true
              sleep $((i * 5))
            done
            [ "$OK" = "1" ] && echo "beacon pushed" || { echo "push lost the race — next hourly beat re-renders (honest skip)"; }
          fi
