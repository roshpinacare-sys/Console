#
#

name: grid-pulse

on:
  schedule:
    - cron: '13 */4 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: grid-pulse
  cancel-in-progress: false

jobs:
  pulse:
    runs-on: ubuntu-latest
    env:
      FLEET_ROSTER_MAP: ${{ secrets.FLEET_ROSTER_MAP }} # refs layer (19-d): ref→name resolution for books + write-time scrub
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Node 20
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Measure the grid from the public chain (keyless)
        run: node agents/grid-pulse.mjs

      - name: Publish the grid state
        if: always()
        run: |
          if [ ! -f dex/grid.json ]; then
            echo "grid.json missing - the agent wrote nothing (honest failure or polite step-aside); nothing to commit"
            exit 0
          fi
          git config user.name "roshpinacare-sys"
          git config user.email "326012154+roshpinacare-sys@users.noreply.github.com"
          node agents/redact-telemetry.mjs dex/grid.json
          git add dex/grid.json
          if git diff --cached --quiet; then
            echo "grid state unchanged - no commit"
            exit 0
          fi
          VERDICT="$(node -p "require('./dex/grid.json').verdict")"
          OPEN="$(node -p "require('./dex/grid.json').openOrdersNow")"
          for attempt in 1 2 3; do
            git commit -m "grid-pulse: ${VERDICT} · ${OPEN} open orders · sovereign keyless mirror · $(date -u +%Y-%m-%dT%H:%M:%SZ)" || exit 0
            git pull --rebase -X theirs --autostash origin main
            if git push; then
              echo "grid state committed on attempt ${attempt}: ${VERDICT} ${OPEN} open"
              exit 0
            fi
          done
          echo "push failed after 3 attempts - next run rebases and continues"
          exit 1
