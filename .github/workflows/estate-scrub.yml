# estate-scrub — self-healing exposure guard for Console books (19-a).
# WHY: the DEX engine (private repo) commit-backs books into this PUBLIC repo.
# If the engine ever emits estate account names (roster map), this workflow scrubs
# them to stable refs (acct-NN) within minutes — the public tree never carries the
# estate map for long. Write-time redaction stays in redact-telemetry.mjs; this is
# the belt-and-braces sweep over every published book.
name: estate-scrub

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write # נגד-סערה: issue-מנוהל-אחד-לכל-עומד (במקום-אימייל-פר-ריצה)

concurrency:
  group: estate-scrub
  cancel-in-progress: false

jobs:
  scrub:
    runs-on: ubuntu-latest
    env:
      FLEET_ROSTER_MAP: ${{ secrets.FLEET_ROSTER_MAP }} # refs layer (19-d): ref→name resolution for books + write-time scrub
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Scrub estate names from all published books
        run: |
          FILES="$(ls dex/*.json agents/*.json weave/census.json weave/agreement.json status.json mirror.json agent/state.json agent/requests.json agent/verify/*.json 2>/dev/null || true)"
          if [ -n "$FILES" ]; then node agents/redact-telemetry.mjs $FILES || true; fi
          # 3-c: sig-locked/chain-evidence books + synced site files — names-only
          # identity scrub (no address/id truncation; chain evidence must survive),
          # and they join the survivor check so a producer re-land goes loud.
          RAW_FILES="$(ls ledger.json saos-live.json saos-live.js wallet.html render.mjs 2>/dev/null || true)"
          if [ -n "$RAW_FILES" ]; then node agents/redact-telemetry.mjs --names-only $RAW_FILES || true; fi
          # verify: fail the run loudly if any estate name survived. The survivor
          # pattern is built from the roster secret at RUNTIME — no account name
          # is committed in this workflow file (exposure law 19-d).
          SURVIVORS="$(FILES="$FILES $RAW_FILES" node -e '
            const fs = require("fs");
            let names = [];
            try {
              const m = JSON.parse(process.env.FLEET_ROSTER_MAP || "null");
              const s = m && m.refs && typeof m.refs === "object" ? m.refs
                : m && m.names && typeof m.names === "object" ? Object.keys(m.names)
                : m;
              names = [...new Set(Object.values(s || {}).concat(m && m.names ? Object.keys(m.names) : []))].filter((v) => typeof v === "string" && v);
            } catch (e) { /* unresolved — report honestly below */ }
            if (!names.length) { console.log("[refs] roster-unresolved: survivor check skipped (no secret)"); process.exit(0); }
            const pat = names.map((n) => n.replace(/[.*+?^${}()|[\]\\]/g, "\\$&")).join("|");
            const re = new RegExp("(^|[^A-Za-z0-9])(" + pat + ")($|[^A-Za-z0-9])", "i");
            const files = (process.env.FILES + " " + (process.env.RAW_FILES || "")).split(/\s+/).filter(Boolean);
            const hits = [];
            for (const f of files) {
              let t = "";
              try { t = fs.readFileSync(f, "utf8"); } catch (e) { continue; }
              if (re.test(t)) hits.push(f);
            }
            console.log(hits.join(" "));
          ')"
          if [ -n "$SURVIVORS" ] && [ "$SURVIVORS" != "[refs] roster-unresolved: survivor check skipped (no secret)" ]; then
            echo "ESTATE-NAME SURVIVED SCRUB — manual fix required: $SURVIVORS"
            exit 1
          fi
          if [ -n "$SURVIVORS" ]; then echo "$SURVIVORS"; fi
      - name: Exposure gate (one-law-two-enforcers — the tree must PASS before any scrub-commit)
        # 25-d: the same detector the producers run (scripts/exposure-rules.mjs) now judges
        # the whole tree here. A poisoned publish goes RED and the scrub-commit never lands.
        # נגד-סערה (גל-60): כשל-אמת אינו-קורס-את-הריצה-שוב-ושוב (אימייל-פר-15-דק) —
        # האדום חי בקבלה-מחויבת-לעץ + issue-מנוהל-מדוד (אימייל-פעם-אחת-לכל-עומד).
        # חוק-החשיפה-עצמו אינו-נחלש: עוד-הפרה → עדיין-אסור-לפרסם-scrub-commit.
        id: exposure
        run: |
          if node scripts/exposure-scan.mjs > /tmp/exposure.out 2>&1; then
            echo "verdict=GREEN" >> "$GITHUB_OUTPUT"
            tail -3 /tmp/exposure.out
          else
            echo "verdict=RED" >> "$GITHUB_OUTPUT"
            {
              echo "### exposure-gate RED · $(date -u +%Y-%m-%dT%H:%M:%SZ)"
              echo ""
              echo '```'
              cat /tmp/exposure.out
              echo '```'
            } > /tmp/exposure.md
            SIG=$(sha256sum /tmp/exposure.out | cut -c1-12)
            if gh issue list --label exposure-gate --state open --json title -q '.[].title' | grep -q "SIG:$SIG"; then
              echo "issue for SIG:$SIG already open — no new email (anti-storm)"
            else
              gh issue create --label exposure-gate --title "estate-scrub: exposure-gate RED · SIG:$SIG" --body-file /tmp/exposure.md || true
            fi
            git add -A
            git diff --cached --quiet || git commit -m "exposure-gate: RED receipt (anti-storm, no per-run email) · $(date -u +%Y-%m-%dT%H:%M:%SZ)" || true
            exit 0
          fi
      - name: Commit scrubbed books
        if: steps.exposure.outputs.verdict == 'GREEN' # חוק-החשיפה: עץ-אדום = אין-commit
        run: |
          git config user.name "roshpinacare-sys"
          git config user.email "326012154+roshpinacare-sys@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "estate-scrub: refs applied to published books · $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            for i in 1 2 3 4 5; do git pull --rebase -X theirs --autostash --autostash origin main && git push && break || sleep 5; done
          else
            echo "books already clean"
          fi
