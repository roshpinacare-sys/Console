#
#

name: rea-desk

on:
  workflow_dispatch:
  schedule:
    - cron: '52 4 * * 2'
permissions:
  contents: write

concurrency:
  group: rea-desk
  cancel-in-progress: false

jobs:
  desk:
    runs-on: ubuntu-latest
    env:
      FLEET_ROSTER_MAP: ${{ secrets.FLEET_ROSTER_MAP }} # refs layer (19-d): ref→name resolution for books + write-time scrub
    timeout-minutes: 12
    steps:
      - name: Checkout the public console
        uses: actions/checkout@v4

      - name: Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run the sovereign reverse-engineering desk
        run: node dex/rea-desk.mjs

      - name: Publish the rea evidence book
        run: |
          git config user.name "roshpinacare-sys"
          git config user.email "326012154+roshpinacare-sys@users.noreply.github.com"
          node agents/redact-telemetry.mjs dex/rea.json
          git add dex/rea.json
          if git diff --cached --quiet; then
            echo "the rea book is unchanged"
            exit 0
          fi
          SEM_NOW="$(jq -Sc '{r: .rea, t: [.targets[] | {id, status, pageBytes, pageTitle}], l: .limitations}' dex/rea.json)"
          git show HEAD:dex/rea.json > /tmp/prev-rea.json 2>/dev/null \
            && SEM_PREV="$(jq -Sc '{r: .rea, t: [.targets[] | {id, status, pageBytes, pageTitle}], l: .limitations}' /tmp/prev-rea.json)" \
            || SEM_PREV=""
          LAST_TS="$(git log -1 --format=%cI -- dex/rea.json)"
          LAST_S="$(date -u -d "$LAST_TS" +%s 2>/dev/null || echo 0)"
          AGE_D=$(( ($(date -u +%s) - LAST_S) / 86400 ))
          if [ "$SEM_NOW" = "$SEM_PREV" ] && [ "$AGE_D" -lt 7 ]; then
            echo "rea evidence unchanged and heartbeat fresh (${AGE_D}d < 7d) - no commit, Pages quota spared"
            exit 0
          fi
          git commit -m "rea-desk: $(date -u +%FT%TZ) · rea $(jq -r '.rea.version // "?"' dex/rea.json) · $(jq -r '[.targets[] | select(.status == 200)] | length' dex/rea.json)/$(jq -r '.targets | length' dex/rea.json) surfaces · $(jq -r '[.targets[].scripts[]?.endpoints[]?] | length' dex/rea.json) public endpoints"
          for i in 1 2 3; do git pull --rebase -X theirs --autostash --autostash origin main && git push && break || sleep 3; done
